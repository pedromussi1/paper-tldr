name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Prefer the lean CPU build of torch (tests don't touch CUDA, saves ~1 GB).
      # PyTorch's own download CDN (download.pytorch.org) periodically returns
      # TLS handshake errors unrelated to this repo. Retry it a few times, then
      # fall back to the PyPI torch build (served from a different CDN) so a
      # PyTorch-CDN outage can't red-line CI. Verify the import either way.
      - name: Install torch (CPU, with PyPI fallback)
        run: |
          ok=0
          for i in 1 2 3; do
            pip install torch --index-url https://download.pytorch.org/whl/cpu && { ok=1; break; }
            echo "CPU-index torch attempt $i failed; retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          if [ "$ok" -ne 1 ]; then
            echo "PyTorch CPU CDN unreachable — falling back to the PyPI torch build."
            pip install torch
          fi
          python -c "import torch; print('torch', torch.__version__)"

      # Install only what the test suite imports. We deliberately skip
      # bitsandbytes / peft / trl / wandb / dvc — those require GPU or are
      # network-heavy and aren't exercised by the unit tests.
      # Pin ruff so local and CI behave identically. Bump intentionally.
      - name: Install minimal test dependencies
        run: pip install pytest "ruff==0.15.12" transformers datasets evaluate rouge-score bert-score pyyaml

      - name: Lint with ruff
        run: ruff check src scripts tests

      - name: Run tests
        run: pytest tests -v
