name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Use the CPU build of torch — tests don't touch CUDA, this saves ~1 GB.
      # Retry: PyTorch's download CDN occasionally returns transient TLS/handshake
      # errors that have nothing to do with this repo. Back off and retry a few
      # times, then verify the import so a genuine failure still fails the job.
      - name: Install CPU-only torch
        run: |
          for i in 1 2 3 4 5; do
            pip install torch --index-url https://download.pytorch.org/whl/cpu && break
            echo "torch install attempt $i failed; retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
          python -c "import torch; print('torch', torch.__version__)"

      # Install only what the test suite imports. We deliberately skip
      # bitsandbytes / peft / trl / wandb / dvc — those require GPU or are
      # network-heavy and aren't exercised by the unit tests.
      # Pin ruff so local and CI behave identically. Bump intentionally.
      - name: Install minimal test dependencies
        run: pip install pytest "ruff==0.15.12" transformers datasets evaluate rouge-score bert-score pyyaml

      - name: Lint with ruff
        run: ruff check src scripts tests

      - name: Run tests
        run: pytest tests -v
